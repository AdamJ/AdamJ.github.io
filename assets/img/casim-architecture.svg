<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 270" width="1000" height="270" role="img"><title>Three clients connect to one MCP server, which gates access to four project data sources</title><rect width="1000" height="270" rx="12" fill="#F5F1E8" stroke="#DBD5CB"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5A6B4F"/></marker></defs><text x="40" y="34" font-size="12" letter-spacing="1.5" fill="#6B5D52" font-family="JetBrains Mono,monospace">CLIENTS</text><text x="400" y="34" font-size="12" letter-spacing="1.5" fill="#6B5D52" font-family="JetBrains Mono,monospace">ONE MCP SERVER</text><text x="740" y="34" font-size="12" letter-spacing="1.5" fill="#6B5D52" font-family="JetBrains Mono,monospace">PROJECT DATA</text><rect x="40" y="56" width="240" height="48" rx="10" fill="#F5F1E8" stroke="#2D1F12" stroke-width="1.5"/><text x="160.0" y="85.0" text-anchor="middle" font-size="15" font-weight="500" fill="#2D1F12" font-family="Inter, system-ui, sans-serif">Claude Desktop</text><rect x="40" y="126" width="240" height="48" rx="10" fill="#F5F1E8" stroke="#2D1F12" stroke-width="1.5"/><text x="160.0" y="155.0" text-anchor="middle" font-size="15" font-weight="500" fill="#2D1F12" font-family="Inter, system-ui, sans-serif">MCP Inspector</text><rect x="40" y="196" width="240" height="48" rx="10" fill="#F5F1E8" stroke="#2D1F12" stroke-width="1.5"/><text x="160.0" y="225.0" text-anchor="middle" font-size="15" font-weight="500" fill="#2D1F12" font-family="Inter, system-ui, sans-serif">Custom interface</text><line x1="280" y1="80" x2="400" y2="130" stroke="#5A6B4F" stroke-width="2" marker-end="url(#a)"/><line x1="280" y1="150" x2="400" y2="150" stroke="#5A6B4F" stroke-width="2" marker-end="url(#a)"/><line x1="280" y1="220" x2="400" y2="170" stroke="#5A6B4F" stroke-width="2" marker-end="url(#a)"/><rect x="400" y="90" width="220" height="120" rx="10" fill="#5A6B4F" stroke="#5A6B4F" stro